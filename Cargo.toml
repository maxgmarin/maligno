[package]
name = "maligno-rs"
version = "0.33.1"
edition = "2024"

[[bin]]
name = "maligno"
path = "src/main.rs"

[dependencies]
clap     = { version = "4", features = ["derive"] }
anyhow   = "1"
flate2   = "1"
ext-sort = { version = "0.1", features = ["memory-limit"] }

# Parquet output for the comparison table. Pinned exactly and feature-trimmed:
# default features would pull 71 new crates (arrow-csv/json/cast/string/ord/arith,
# the regex stack, serde_json, and the brotli/snap/lz4 codecs); this set pulls 35.
# The three versions must move together — parquet's `arrow` feature depends on the
# arrow-* crates at a matching version.
arrow-array  = { version = "=59.3.0", default-features = false }
arrow-schema = { version = "=59.3.0", default-features = false }
parquet      = { version = "=59.3.0", default-features = false, features = ["arrow", "zstd"] }

# SAM/BAM input for `compare` and `sam2paf`. default-features = false drops `curl`
# (curl-sys + openssl-sys, which break static musl builds; `s3`/`gcs` imply it too).
# `bzip2`/`lzma` are CRAM-only codecs and maligno never reads CRAM, so they stay off.
rust-htslib = { version = "=0.46.0", default-features = false }
# Not used directly: pins rust-htslib 0.46's C bindings. hts-sys 2.2.1 changed binding
# types (e.g. usize lengths) and no longer compiles with rust-htslib 0.46.0.
hts-sys     = { version = "=2.2.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
